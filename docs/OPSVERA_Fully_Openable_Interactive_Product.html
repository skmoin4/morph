function changeOrderTable(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Change</th><th>Project</th><th>Reason</th><th>Extra Hours</th><th>Cost</th><th>Proposed</th><th>Status</th></tr></thead><tbody><tr><td><b>CO-018</b></td><td>Hospital A</td><td>Client ceiling revision</td><td>118h</td><td>₹0.52L</td><td>₹0.82L</td><td>${moneyPill('Client Review')}</td></tr><tr><td><b>CO-017</b></td><td>Beta Pharma</td><td>Added cleanroom area</td><td>86h</td><td>₹0.38L</td><td>₹0.60L</td><td>${moneyPill('Approved')}</td></tr></tbody></table></div>`}
function estimateTable(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Estimate</th><th>Client</th><th>Related Proposal</th><th>Value</th><th>Validity</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td>EST-2026-119</td><td>Apex Solar</td><td>PR-2026-101</td><td>₹9.20L</td><td>15 Oct</td><td>${moneyPill('Accepted')}</td><td><button class="btn primary" data-go="bookings">Create Booking</button></td></tr><tr><td>EST-2026-120</td><td>MediCore</td><td>PR-2026-104</td><td>₹7.50L</td><td>18 Oct</td><td>${moneyPill('Sent')}</td><td><button class="btn">Send Reminder</button></td></tr></tbody></table></div>`}
function invoiceTable(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Client</th><th>Project</th><th>Amount</th><th>Due</th><th>Status</th><th>Action</th></tr></thead><tbody>${data.invoices.map((r,i)=>`<tr class="clickable invoice-open" data-i="${i}"><td><div class="name">${r[0]}</div></td><td>${r[1]}</td><td>${r[2]}</td><td><b>${r[3]}</b></td><td>${r[4]}</td><td>${moneyPill(i===0?state.invoiceStatus:r[5])}</td><td><button class="btn" data-action="payment" data-i="${i}">${i===0?'Record Payment':'View'}</button></td></tr>`).join('')}</tbody></table></div>`}
function aging(){return `<div class="list"><div class="list-item"><div><b>0–30 days</b><small>7 invoices</small></div><b>₹5.60L</b></div><div class="list-item"><div><b>31–60 days</b><small>3 invoices</small></div><b class="warn">₹2.40L</b></div><div class="list-item"><div><b>61–90 days</b><small>2 invoices</small></div><b class="bad">₹1.10L</b></div><div class="list-item"><div><b>90+ days</b><small>1 invoice</small></div><b class="bad">₹0.70L</b></div></div>`}
function expenseTable(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Expense</th><th>Employee</th><th>Project</th><th>Amount</th><th>Billable</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td>Site Travel</td><td>Poonam S</td><td>Hospital A</td><td>₹3,850</td><td>Yes</td><td>${moneyPill(state.expense)}</td><td><button class="btn primary" data-action="approve-expense">${state.expense==='Approved'?'Approved':'Approve'}</button></td></tr><tr><td>Vendor Printing</td><td>Ahmed</td><td>MAA10 DG</td><td>₹2,500</td><td>No</td><td>${moneyPill('Approved')}</td><td>Cost posted</td></tr></tbody></table></div>`}
function paymentTable(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Payment</th><th>Client</th><th>Invoice</th><th>Amount</th><th>Date</th><th>Method</th><th>Status</th></tr></thead><tbody><tr><td>PAY-2026-084</td><td>ABC Healthcare</td><td>INV-26-091</td><td>₹1.20L</td><td>04 Oct</td><td>Bank</td><td>${moneyPill('Allocated')}</td></tr><tr><td>PAY-2026-083</td><td>DataCore</td><td>INV-26-088</td><td>₹1.00L</td><td>03 Oct</td><td>Bank</td><td>${moneyPill('Allocated')}</td></tr></tbody></table></div>`}
function payrollTable(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Base</th><th>OT</th><th>Reimb.</th><th>Deductions</th><th>Net</th><th>Status</th></tr></thead><tbody><tr><td>Ahmed Khan</td><td>₹58,000</td><td>₹2,400</td><td>₹3,850</td><td>₹5,900</td><td>₹58,350</td><td>${moneyPill(state.payroll)}</td></tr><tr><td>Mayur Patil</td><td>₹46,000</td><td>₹1,800</td><td>₹1,200</td><td>₹4,800</td><td>₹44,200</td><td>${moneyPill(state.payroll)}</td></tr></tbody></table></div>`}
function roleMatrix(){let rows=[['Employee Records','✓','✓','View','Team','Own'],['Salary / CTC','✓','✓','Policy','—','Own payslip'],['Project Margin','✓','—','✓','Summary','—'],['Timesheet Approve','✓','—','—','Assigned','—'],['Screenshots','Policy','Policy','—','Policy','Own'],['Invoices / Payment','✓','—','✓','—','—'],['Payroll','✓','✓','Policy','—','—']];return `<div class="role-grid"><div class="head">Permission</div><div class="head">CEO</div><div class="head">HR</div><div class="head">Finance</div><div class="head">PM</div><div class="head">Employee</div>${rows.map(r=>r.map((x,i)=>`<div class="${i&&x==='✓'?'check':''}">${x}</div>`).join('')).join('')}</div>`}
function formatTime(s){let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return [h,m,sec].map(x=>String(x).padStart(2,'0')).join(':')}
function showToast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>x.classList.remove('show'),2200)}
function openModal(title,sub,body,primary='Save'){ $('#modalTitle').textContent=title;$('#modalSub').textContent=sub||'';$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=`<button class="btn" data-modal-close>Cancel</button><button class="btn primary" id="modalPrimary">${primary}</button>`;$('#modalBg').classList.add('open');$('[data-modal-close]').onclick=closeModal;$('#modalPrimary').onclick=()=>{showToast(primary+' completed in demo');closeModal()}}
function closeModal(){$('#modalBg').classList.remove('open')}
function openDrawer(title,body){$('#drawerTitle').textContent=title;$('#drawerBody').innerHTML=body;$('#drawer').classList.add('open');$('#drawerBg').classList.add('open')}
function closeDrawer(){$('#drawer').classList.remove('open');$('#drawerBg').classList.remove('open')}
function bindPage(){
 $$('[data-go]').forEach(b=>b.onclick=e=>render(e.currentTarget.dataset.go));
 $$('[data-open]').forEach(b=>b.onclick=e=>openForm(e.currentTarget.dataset.open));
 $$('.project-open').forEach(r=>r.onclick=()=>openProject(+r.dataset.i));
 $$('.employee-open').forEach(r=>r.onclick=()=>openEmployee(+r.dataset.i));
 $$('.client-open').forEach(r=>r.onclick=()=>openClient(r.dataset.client));
 $$('.invoice-open').forEach(r=>r.onclick=e=>{if(!e.target.closest('button'))openInvoice(+r.dataset.i)});
 $$('.generic-open').forEach(r=>r.onclick=()=>openDrawer(r.dataset.title,genericDetail(r.dataset.title)));
 $$('.life').forEach((x,i)=>x.onclick=()=>render(['leads','opportunities','proposals','opportunities','bookings','bookings','bookings','projects'][i]));
 $$('[data-ai]').forEach(b=>b.onclick=()=>aiAnswer(b.dataset.ai));
 $$('[data-toggle]').forEach(t=>t.onclick=()=>{state[t.dataset.toggle]=!state[t.dataset.toggle];render(state.screen);showToast(t.dataset.toggle+' policy updated')});
 $$('[data-action]').forEach(b=>b.onclick=e=>doAction(e.currentTarget.dataset.action,e.currentTarget));
 $$('.move-task').forEach(t=>t.onclick=()=>{t.style.opacity=.45;showToast('Task moved to next workflow stage')});
 $$('.screenshot').forEach(s=>s.onclick=()=>openDrawer('Screenshot Preview',`<div class="shot" style="height:320px"><span>Simulated work screenshot • Privacy blurred</span></div><p class="sub" style="margin-top:12px">Access to screenshots should be permission controlled and audited.</p>`));
 $$('[data-open="quick"]').forEach(b=>b.onclick=quickModal);
 let tb=$('#timerToggle');if(tb)tb.onclick=toggleTimer;let tb2=$('#timerBtn');if(tb2)tb2.onclick=toggleTimer;
 let cb=$('#clockBtn');if(cb)cb.onclick=()=>{state.clocked=!state.clocked;showToast(state.clocked?'Clocked in successfully':'Clocked out successfully');render('attendance')};
 let pr=$('#payrollRun');if(pr)pr.onclick=()=>{state.payroll=state.payroll==='Draft'?'Calculated':state.payroll==='Calculated'?'Approved':'Locked';showToast('Payroll status: '+state.payroll);render('payroll')};
}
function openForm(type){let forms={lead:['New Lead','Capture enquiry before qualification'],opportunity:['New Opportunity','Qualified commercial opportunity'],proposal:['New Proposal','Scope, deliverables, commercials and terms'],booking:['Confirm Booking','PO / Work Order verification before code generation'],client:['New Client','Client master and billing details'],employee:['Add Employee','People master and employment setup'],leave:['Leave Request','Submit date, leave type and reason'],timesheet:['Manual Time Entry','Add time with project/task context'],allocation:['New Resource Allocation','Allocate employee to project/date range'],project:['New Project','Usually created from confirmed booking'],task:['New Task','Project execution task'],change:['New Change Request','Capture extra scope before commercialization'],estimate:['New Estimate','Finance estimate linked to proposal/client'],invoice:['New Invoice','Create from billing-ready project items'],expense:['New Expense','Project/non-project expense with receipt'],payment:['Record Payment','Allocate incoming amount to client invoice'],role:['Custom Role','Create granular permission role'],classification:['App / URL Classification','Define productive, neutral and non-work context'], 'switch-task':['Change Current Task','Switch timer context without losing tracked time']};let f=forms[type]||['Create Item','Demo form'];openModal(f[0],f[1],`<div class="form-grid"><div class="field"><label>Name / Reference</label><input placeholder="Enter value"></div><div class="field"><label>Project / Client</label><select><option>Hospital A</option><option>MAA10 DG</option><option>Beta Pharma</option></select></div><div class="field"><label>Amount / Hours</label><input placeholder="0"></div><div class="field"><label>Status / Type</label><select><option>Draft</option><option>Active</option><option>Billable</option></select></div><div class="field" style="grid-column:1/-1"><label>Notes</label><textarea placeholder="Add details, scope, comments or context"></textarea></div></div>`,type==='booking'?'Confirm Booking':'Save')}
function quickModal(){openModal('Quick Action','Start any common workflow without leaving the current context',`<div class="cards" style="grid-template-columns:repeat(3,1fr)">${[['lead','New Lead'],['proposal','New Proposal'],['booking','Confirm Booking'],['project','New Project'],['invoice','New Invoice'],['expense','New Expense']].map(x=>`<button class="card quick-choice" data-q="${x[0]}" style="cursor:pointer;text-align:left"><h3>${x[1]}</h3><p>Open workflow</p></button>`).join('')}</div>`,'Close');setTimeout(()=>$$('.quick-choice').forEach(x=>x.onclick=()=>{closeModal();openForm(x.dataset.q)}),0)}
function doAction(a,el){if(a==='approve-time'){state.timesheet='Approved';showToast('Timesheet approved • labor cost posted to project cost ledger');render('timesheets')}else if(a==='approve-expense'){state.expense='Approved';showToast('Expense approved • project cost posted exactly once');render(state.screen)}else if(a==='payment'){state.invoiceStatus='Part Paid';showToast('Payment recorded • invoice balance updated');render('invoices')}else if(a==='generate-code'){if(!state.bookingCode){state.bookingCode='MOR-26-27-HOS-0047';showToast('Project code generated: '+state.bookingCode)}else showToast('Project activated from confirmed booking');render('bookings')}else if(a==='proposal-accept'){showToast('Proposal accepted • ready for booking workflow');render('bookings')}else if(a==='regularize'){showToast('Attendance regularization approved')}else if(a==='portal-preview'){showToast('Client-safe portal preview opened')}else if(a==='staff'){showToast('Draft staffing allocation applied')}else if(a==='export'){showToast('CSV export generated in demo')}else if(a==='connect'){el.textContent='Connected';showToast('Integration connected in demo')}else if(a==='save-settings'){showToast('Settings saved')}else showToast('Action completed in demo')}
function toggleTimer(){state.timerRunning=!state.timerRunning;showToast(state.timerRunning?'Work timer started':'Work timer stopped');render('work-intelligence')}
setInterval(()=>{if(state.timerRunning){state.timerSeconds++;let t=$('#timerText');if(t)t.textContent=formatTime(state.timerSeconds)}},1000);
function aiAnswer(type){let answers={margin:'Beta Pharma and Hospital A need margin attention. Beta Pharma has consumed 81% of estimated hours at 73% progress; Hospital A has 38 approved unbilled hours and a likely client-driven change.',capacity:'Next week Sara has 48% availability and Nitin has 37%. MEP overall is tight because confirmed + weighted pipeline demand reaches about 118%.',cash:'₹4.20L is overdue. PharmaOne is the largest aging risk at ₹2.80L and has a slower historical payment pattern.',sales:'You can accept a ₹20L project only if its start is staggered or additional MEP capacity is added. Current MEP forecast is already above 100% if two pipeline deals close.'};let target=$('#aiAnswer')||$('#aiQuick');if(target)target.textContent=answers[type]||'Insight generated';showToast('AI answer updated')}
function openProject(i){let p=data.projects[i];openDrawer(p.name,`<div class="detail-grid"><div class="detail"><span>Project Code</span><b>${p.code}</b></div><div class="detail"><span>Contract</span><b>${p.value}</b></div><div class="detail"><span>Progress</span><b>${p.progress}%</b></div><div class="detail"><span>Hours Burn</span><b>${p.hours}%</b></div><div class="detail"><span>Actual Cost</span><b>${p.cost}</b></div><div class="detail"><span>Projected Margin</span><b>${p.margin}</b></div></div><div class="tabs" style="margin-top:15px"><button class="tab active">Overview</button><button class="tab">Team</button><button class="tab">Tasks</button><button class="tab">Time</button><button class="tab">Cost</button><button class="tab">Billing</button><button class="tab">Changes</button></div><div class="alerts"><div class="alert high"><div class="aico">!</div><div><b>${p.status}</b><p>Project 360 combines delivery, work, cost and commercial context instead of forcing the user across separate apps.</p></div><time>Live</time></div></div><div class="timeline"><div class="timeline-item"><i></i><div><b>Booking confirmed</b><p>Commercial baseline and payment terms locked.</p></div></div><div class="timeline-item"><i></i><div><b>Project code generated</b><p>${p.code}</p></div></div><div class="timeline-item"><i></i><div><b>Work and costs flowing</b><p>Approved timesheets and expenses post to the project cost ledger.</p></div></div><div class="timeline-item"><i></i><div><b>Billing readiness tracked</b><p>Milestones, approved time, expenses and change orders feed invoicing.</p></div></div></div>`)}
function openEmployee(i){let r=data.employees[i];openDrawer(r[1],`<div class="detail-grid"><div class="detail"><span>Employee ID</span><b>${r[0]}</b></div><div class="detail"><span>Role</span><b>${r[2]}</b></div><div class="detail"><span>Status</span><b>${r[5]}</b></div><div class="detail"><span>Current Context</span><b>${r[3]}</b></div><div class="detail"><span>Productivity</span><b>${r[4]}</b></div><div class="detail"><span>Billable Utilization</span><b>78%</b></div></div><div class="tabs" style="margin-top:15px"><button class="tab active">Profile</button><button class="tab">Attendance</button><button class="tab">Work</button><button class="tab">Projects</button><button class="tab">Skills</button><button class="tab">Payroll</button><button class="tab">Assets</button></div><p class="sub">Employee 360 is permission-aware. Salary and sensitive tracking data should only be visible to authorized roles.</p>`)}
function openClient(c){openDrawer(c,`<div class="detail-grid"><div class="detail"><span>Active Projects</span><b>3</b></div><div class="detail"><span>Revenue YTD</span><b>₹28.4L</b></div><div class="detail"><span>Outstanding</span><b>₹2.40L</b></div><div class="detail"><span>Avg Pay Days</span><b>34</b></div><div class="detail"><span>Pipeline</span><b>₹8.20L</b></div><div class="detail"><span>Client Margin</span><b>31%</b></div></div><div class="tabs" style="margin-top:15px"><button class="tab active">Overview</button><button class="tab">Contacts</button><button class="tab">Opportunities</button><button class="tab">Projects</button><button class="tab">Invoices</button><button class="tab">Documents</button></div>`)}
function openInvoice(i){let r=data.invoices[i];openDrawer(r[0],`<div class="detail-grid"><div class="detail"><span>Client</span><b>${r[1]}</b></div><div class="detail"><span>Project</span><b>${r[2]}</b></div><div class="detail"><span>Amount</span><b>${r[3]}</b></div><div class="detail"><span>Due</span><b>${r[4]}</b></div><div class="detail"><span>Status</span><b>${i===0?state.invoiceStatus:r[5]}</b></div><div class="detail"><span>Source</span><b>Project Billing</b></div></div><div class="timeline"><div class="timeline-item"><i></i><div><b>Billing item generated</b><p>Milestone + approved billable items.</p></div></div><div class="timeline-item"><i></i><div><b>Invoice issued</b><p>Project and client balances updated.</p></div></div><div class="timeline-item"><i></i><div><b>Client viewed</b><p>Portal / email interaction captured.</p></div></div></div>`)}
function genericDetail(title){return `<div class="detail-grid"><div class="detail"><span>Status</span><b>Active</b></div><div class="detail"><span>Owner</span><b>Sales Team</b></div><div class="detail"><span>Last Activity</span><b>Today</b></div></div><div class="timeline"><div class="timeline-item"><i></i><div><b>${title} created</b><p>Record entered in OPSVERA.</p></div></div><div class="timeline-item"><i></i><div><b>Next action scheduled</b><p>Workflow state and activity are traceable.</p></div></div></div>`}
$('#modalClose').onclick=closeModal;$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};$('#drawerClose').onclick=closeDrawer;$('#drawerBg').onclick=closeDrawer;
$$('.nav').forEach(n=>n.onclick=()=>render(n.dataset.screen));
$('#quick').onclick=quickModal;
$('#prototypeMap').onclick=()=>openDrawer('OPSVERA Prototype Map',`<p class="sub">Every sidebar item in this prototype opens a functional screen. Core actions are interactive and stateful within this browser session.</p><div class="cards" style="grid-template-columns:repeat(2,1fr)">${[['Commercial','Lead → Opportunity → Proposal → PO → Booking → Code'],['People & Work','Employee → Attendance → Activity → Timesheet'],['Delivery','Project → Task → Deliverable → Change Order'],['Money','Estimate → Invoice → Payment → Receivable'],['Economics','Approved work/expense → Project Cost Ledger → Margin'],['Intelligence','Executive + Work + Project + Finance + AI COO']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>`);
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.trim();if(q)openDrawer('Search Results',`<p class="sub">Simulated global search for <b>${q}</b>.</p><div class="list"><div class="list-item"><div><b>Hospital A — Project</b><small>MOR-26-27-HOS-0043</small></div><button class="btn" onclick="closeDrawer();render('projects')">Open</button></div><div class="list-item"><div><b>ABC Healthcare — Client</b><small>3 active projects</small></div><button class="btn" onclick="closeDrawer();render('clients')">Open</button></div><div class="list-item"><div><b>INV-26-091 — Invoice</b><small>₹2.40L</small></div><button class="btn" onclick="closeDrawer();render('invoices')">Open</button></div></div>`)}});
render('executive');
</script>
